<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMU_Q&A</title>
<style>
  :root{
    --bg:#fff; --line:#ecedf1; --text:#1f2328; --muted:#9096a0;
    --brand:#2f6fed; --bot:#f3f5f8; --composer:#f6f7f9;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .app{
    height:100vh; height:100dvh; width:100%;
    display:flex; flex-direction:column;
  }

  header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:14px 24px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.92);
  }
  header h1{font-size:15px; margin:0; font-weight:600}
  .dot{width:8px; height:8px; border-radius:50%; background:#c9ced6}
  .dot.ok{background:#22c55e}
  .dot.bad{background:#ef4444}
  #status{font-size:12px; color:var(--muted)}
  .spacer{flex:1}
  button{font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line);
         background:#fff; padding:7px 14px; color:var(--text)}
  button:hover{border-color:#d3d7de}
  button:disabled{opacity:.5; cursor:not-allowed}

  /* ---------- 对话态：消息区铺满，输入框贴底 ---------- */
  #messages{flex:1 1 auto; overflow-y:auto; padding:26px 20px 8px}
  #thread{max-width:820px; margin:0 auto}

  .row{display:flex; margin-bottom:18px}
  .row.user{justify-content:flex-end}
  .bubble{
    max-width:82%; padding:11px 15px; border-radius:16px;
    white-space:pre-wrap; word-break:break-word;
  }
  /* 回答里的链接：跟气泡文字同色 + 下划线，长链接允许断行 */
  .bubble a{color:inherit; text-decoration:underline; text-underline-offset:2px; overflow-wrap:anywhere}
  .row.user .bubble{background:var(--brand); color:#fff; border-bottom-right-radius:6px}
  .row.assistant .bubble{background:var(--bot); border-bottom-left-radius:6px}
  .placeholder{color:var(--muted)}
  .typing::after{content:"▍"; animation:blink 1s steps(2) infinite; margin-left:2px}
  .error{color:#b42318}
  @keyframes blink{50%{opacity:0}}

  footer{
    flex:0 0 auto; padding:10px 20px 16px;
    background:linear-gradient(to top, #fff 70%, rgba(255,255,255,0));
  }
  .composer{
    width:100%; max-width:820px; margin:0 auto;
    display:flex; align-items:flex-end; gap:12px;
    background:#fafbfc;
    border:1px solid #e6e8ee; border-radius:28px;
    padding:16px 14px 12px 20px;
    box-shadow:0 2px 10px rgba(16,24,40,.04);
    transition:box-shadow .15s, border-color .15s;
  }
  .composer:focus-within{
    border-color:#cfd8ea;
    box-shadow:0 6px 20px rgba(16,24,40,.07);
  }
  #input{
    flex:1; border:0; outline:0; resize:none; background:transparent;
    font:inherit; font-size:15.5px; line-height:1.7;
    min-height:72px; max-height:240px;
    padding:0; color:var(--text);
  }
  #input::placeholder{color:#a6acb6}
  #send{
    flex:0 0 auto; width:38px; height:38px; padding:0;
    border:0; border-radius:50%; background:var(--brand); color:#fff;
    font-size:18px; line-height:1; display:grid; place-items:center;
    box-shadow:0 2px 8px rgba(47,111,237,.28);
  }
  #send:hover{filter:brightness(1.06)}
  #send:disabled{background:#c9ced6; cursor:not-allowed}

  .foot{
    max-width:820px; margin:8px auto 0;
    text-align:center; font-size:12px; color:var(--muted);
  }

  /* ---------- 空态：隐藏消息区，输入框居中（像 DeepSeek 首页） ---------- */
  .hero{display:none; max-width:820px; margin:0 auto 22px; text-align:center}
  .hero-title{font-size:24px; font-weight:600; letter-spacing:.3px; margin-bottom:8px}
  .hero-sub{font-size:13px; color:var(--muted)}
  .hero-sub b{color:var(--text); font-weight:600}

  .app.empty #messages{display:none}
  .app.empty footer{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding-bottom:12vh;
    background:none;
  }
  .app.empty .hero{display:block}
  .app.empty .foot{display:none}

  @media (max-width:600px){
    header{padding:12px 14px}
    #messages{padding:18px 14px 6px}
    footer{padding:8px 12px 12px}
    .bubble{max-width:88%}
    .hero-title{font-size:19px}
    .app.empty footer{padding-bottom:8vh}
    .composer{padding:12px 12px 10px 16px}
    #input{min-height:60px; font-size:15px}
  }
</style>
</head>
<body>
<div class="app empty" id="app">
  <header>
    <span class="dot" id="dot"></span>
    <h1>SMU_Q&A</h1>
    <span id="status">连接中…</span>
    <span class="spacer"></span>
    <button id="new" title="清空当前对话，重新开始">新建会话</button>
  </header>

  <div id="messages">
    <div id="thread"></div>
  </div>

  <footer>
    <div class="hero" id="hero">
      <div class="hero-title">你好，我能帮什么忙？</div>
      <div class="hero-sub">比如：<b>SMU校史</b></div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行 <如果输出超时,试着把问题拆分再次提问>"></textarea>
      <button id="send" aria-label="发送">↑</button>
    </div>

    <div class="foot">对话保存在服务端，刷新页面会自动恢复</div>
  </footer>
</div>

<script>
(() => {
  const app      = document.getElementById('app');
  const scroller = document.getElementById('messages');
  const thread   = document.getElementById('thread');
  const input    = document.getElementById('input');
  const send     = document.getElementById('send');
  const btnNew   = document.getElementById('new');
  const dot      = document.getElementById('dot');
  const status   = document.getElementById('status');

  let busy = false;

  const scrollBottom = () => { scroller.scrollTop = scroller.scrollHeight; };

  /** true = 空态（输入框居中）；false = 对话态（输入框贴底） */
  function setEmpty(v) {
    app.classList.toggle('empty', v);
    if (v) input.focus();
  }

  function resizeTextarea() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 240) + 'px';
  }

  function setBusy(v) {
    busy = v;
    send.disabled = v;
    input.disabled = v;
    if (!v) input.focus();
  }

  // ---------- 文本 -> 安全 HTML：只做一件事，让网址能点 ----------
  // 顺序不能反：先把整段文本转义（挡住模型输出里的 <script> 之类），
  // 再把转义后文本里的 URL 包成 <a>。所以这里用 innerHTML 也是安全的。
  const ESCAPE_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ESCAPE_MAP[c]);

  // 到空白、引号、右括号、中文标点为止，避免把句尾的“。”也算进链接
  const URL_RE = /(https?:\/\/[^\s<>"'）)】\]，。；、]+)/g;

  function renderText(el, text) {
    const safe = escapeHtml(text || '');
    el.innerHTML = safe.replace(
      URL_RE,
      '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
    );
  }

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const b = document.createElement('div');
    b.className = 'bubble';
    renderText(b, text);             // 转义后再把链接变可点，不是直接塞原文
    row.appendChild(b);
    thread.appendChild(row);
    scrollBottom();
    return b;
  }

  // ---------- 启动：恢复历史 + 探活 ----------
  async function loadHistory() {
    try {
      const r = await fetch('/api/history', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      const msgs = data.messages || [];
      if (msgs.length === 0) { setEmpty(true); return; }

      setEmpty(false);
      for (const m of msgs) addBubble(m.role, m.content);
      scrollBottom();
    } catch (e) {
      setEmpty(true);
      console.warn('读取历史失败', e);
    }
  }

  async function checkHealth() {
    try {
      const r = await fetch('/api/health', { cache: 'no-store' });
      const d = await r.json();
      if (d.ok) {
        dot.className = 'dot ok';
        status.textContent = d.model ? '已连接 · ' + d.model : '已连接';
      } else {
        dot.className = 'dot bad';
        status.textContent = '服务未就绪';
      }
    } catch (e) {
      dot.className = 'dot bad';
      status.textContent = '离线';
    }
  }

  // ---------- 新建会话：回到空态，输入框回中间 ----------
  async function newSession() {
    if (busy) return;
    try {
      const r = await fetch('/api/reset', { method: 'POST' });
      // 后端正在生成时会返回 409：这时不要清界面，否则界面清了、服务端历史还在
      if (!r.ok) { console.warn('新建会话失败', r.status); return; }
    } catch (e) { console.warn(e); return; }
    thread.innerHTML = '';
    setEmpty(true);
  }

  // ---------- 提问 ----------
  async function ask() {
    const q = input.value.trim();
    if (!q || busy) return;

    setEmpty(false);                 // 有第一条消息就切到对话态
    addBubble('user', q);
    input.value = '';
    resizeTextarea();
    setBusy(true);

    const b = addBubble('assistant', '正在思考…');
    b.classList.add('placeholder', 'typing');

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q }),
      });
      if (!r.ok) {
        let detail = r.status + ' ' + r.statusText;
        try { const err = await r.json(); if (err.detail) detail = err.detail; } catch (_) {}
        throw new Error(detail);
      }
      const data = await r.json();
      b.classList.remove('placeholder', 'typing');
      renderText(b, data.answer || '（没有返回内容）');
    } catch (e) {
      b.classList.remove('placeholder', 'typing');
      b.classList.add('error');
      renderText(b, '[出错] ' + e.message);
    } finally {
      setBusy(false);
      scrollBottom();
    }
  }

  // ---------- 事件绑定 ----------
  send.addEventListener('click', ask);
  btnNew.addEventListener('click', newSession);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      ask();
    }
  });
  input.addEventListener('input', resizeTextarea);

  // 初始化
  checkHealth();
  loadHistory();
})();
</script>
</body>
</html>
